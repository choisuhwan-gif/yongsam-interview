<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대표님 인터뷰 답변지</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fcfcfc; --ink:#111111; --ink-soft:#2d2a27; --text-sub:#909090;
    --acc:#FF3D1E; --rule:#111111; --gray:#CCCCCC; --hover:#F3F3F3;
    --sans:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
    --mono:'Geist Mono',ui-monospace,'SFMono-Regular',monospace;
    --track:.18em;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--sans); background:var(--bg); color:var(--ink); font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased; word-break:keep-all; }
  .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }

  /* ── 상단 바 ── */
  .topbar { position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--rule); padding:14px 20px; }
  .topbar-row { max-width:640px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .topbar h1 { font-size:16px; font-weight:900; color:var(--ink-soft); }
  .topbar .status { font-size:11px; color:var(--text-sub); margin-top:2px; }
  .topbar .status.err { color:var(--acc); font-weight:500; }
  .icon-btn { font-family:var(--sans); font-size:12px; font-weight:700; background:var(--bg); color:var(--ink); border:1px solid var(--rule); padding:7px 12px; cursor:pointer; }
  .icon-btn:hover { background:var(--hover); }
  .progress-track { max-width:640px; margin:10px auto 0; height:2px; background:var(--gray); }
  .progress-fill { height:100%; background:var(--acc); transition:width .25s ease; }

  /* ── 카드 화면 ── */
  .wrap { max-width:640px; margin:0 auto; padding:32px 20px 100px; }
  .card-meta { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; }
  .card-cat { font-family:var(--mono); font-size:12px; font-weight:700; color:var(--acc); text-transform:uppercase; letter-spacing:.06em; }
  .card-pos { font-family:var(--mono); font-size:12px; color:var(--text-sub); }
  .card-q { font-size:20px; font-weight:700; line-height:1.5; margin-bottom:20px; }
  textarea.answer {
    width:100%; min-height:140px; padding:14px; font-family:var(--sans); font-size:16px; line-height:1.65;
    color:var(--ink); background:var(--bg); border:1px solid var(--rule); resize:vertical;
  }
  textarea.answer:focus { outline:none; border:2px solid var(--ink); padding:13px; }
  .btn-row { display:flex; gap:10px; margin-top:18px; }
  .btn { font-family:var(--sans); font-size:14px; font-weight:700; border:1px solid var(--rule); padding:14px 20px; cursor:pointer; background:var(--bg); color:var(--ink); flex:1; }
  .btn:hover { background:var(--hover); }
  .btn.ghost { flex:none; color:var(--text-sub); border-color:var(--gray); }
  .btn.primary { background:var(--ink); color:var(--bg); }
  .btn.primary:hover { background:var(--ink-soft); }
  .btn.primary.saved { background:var(--acc); border-color:var(--acc); }
  .hint { font-size:12px; color:var(--text-sub); margin-top:12px; }

  /* ── 완료 화면 ── */
  .done { text-align:center; padding:60px 20px; }
  .done h2 { font-size:22px; font-weight:900; margin-bottom:10px; }
  .done p { font-size:14px; color:var(--text-sub); margin-bottom:28px; }
  .done .btn-row { max-width:340px; margin:0 auto; }

  /* ── 질문 목록 패널 ── */
  #listPanel { display:none; position:fixed; inset:0; z-index:30; background:var(--bg); overflow-y:auto; }
  #listPanel.show { display:block; }
  .list-head { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--rule); padding:14px 20px; display:flex; justify-content:space-between; align-items:center; max-width:640px; margin:0 auto; }
  .list-body { max-width:640px; margin:0 auto; padding:20px; }
  .list-cat-title { font-size:11px; font-weight:700; color:var(--text-sub); text-transform:uppercase; letter-spacing:.08em; margin:18px 0 8px; }
  .list-cat-title:first-child { margin-top:0; }
  .num-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(40px,1fr)); gap:6px; }
  .num-btn { font-family:var(--mono); font-size:12px; font-weight:700; border:1px solid var(--rule); background:var(--bg); color:var(--text-sub); padding:8px 0; cursor:pointer; }
  .num-btn:hover { background:var(--hover); }
  .num-btn.filled { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .num-btn.current { border-color:var(--acc); border-width:2px; color:var(--acc); }

  /* ── 결과지 ── */
  #resultView { display:none; }
  #resultView.show { display:block; }
  .result-actions { display:flex; gap:8px; margin-bottom:20px; max-width:640px; margin-left:auto; margin-right:auto; padding:0 20px; }
  .result-empty { font-size:13px; color:var(--text-sub); padding:20px; }
  .result-cat { margin-bottom:22px; max-width:640px; margin-left:auto; margin-right:auto; padding:0 20px; }
  .result-cat-title { font-size:12px; font-weight:700; color:var(--text-sub); text-transform:uppercase; letter-spacing:.08em; padding-bottom:8px; border-bottom:1px solid var(--rule); margin-bottom:12px; }
  .result-q { margin-bottom:14px; }
  .result-q .rq { font-size:13.5px; font-weight:700; margin-bottom:4px; }
  .result-q .ra { font-size:14px; white-space:pre-wrap; padding-left:14px; border-left:2px solid var(--rule); }

  @media print {
    .topbar, .progress-track, .wrap, .result-actions, #listPanel { display:none !important; }
    #resultView { display:block !important; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div>
      <h1>대표님 인터뷰 답변지</h1>
      <div class="status" id="statusLine">준비 중…</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="icon-btn" id="openList">질문 목록</button>
    </div>
  </div>
</div>
<div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<div class="wrap" id="cardWrap">
  <div class="card-meta">
    <span class="card-cat" id="cardCat">A</span>
    <span class="card-pos mono" id="cardPos">1 / 54</span>
  </div>
  <div class="card-q" id="cardQ">질문을 불러오는 중…</div>
  <textarea class="answer" id="answerBox" placeholder="여기에 답변을 적어주세요"></textarea>
  <div class="btn-row">
    <button class="btn ghost" id="btnPrev">이전</button>
    <button class="btn" id="btnSkip">건너뛰기</button>
    <button class="btn primary" id="btnDone" style="flex:2">완료 → 다음</button>
  </div>
  <div class="hint">용삼식당 릴스 촬영 (9/12 금 17:00) 전에, 편하신 것들만 채워주셔도 됩니다.</div>
</div>

<div class="wrap done" id="doneScreen" style="display:none">
  <h2>수고하셨습니다!</h2>
  <p>답변이 자동으로 저장됐습니다. 촬영 때 뵙겠습니다.</p>
  <div class="btn-row">
    <button class="btn" id="doneEdit">답변 다시 보기 / 수정</button>
    <button class="btn primary" id="doneResult">결과지 보기</button>
  </div>
</div>

<div id="listPanel">
  <div class="list-head">
    <strong style="font-size:14px;">질문 목록</strong>
    <button class="icon-btn" id="closeList">닫기</button>
  </div>
  <div class="list-body" id="listBody"></div>
</div>

<div id="resultView">
  <div class="result-actions">
    <button class="icon-btn" id="backToForm">← 답변 화면으로</button>
    <button class="icon-btn" id="printResult">인쇄 / PDF 저장</button>
    <button class="icon-btn" id="copySheet">구글시트용 복사 (백업)</button>
  </div>
  <div id="resultBody"></div>
</div>

<script>
(function(){
  var CATS = [
    {key:'A', title:'도입 — 이 사람은 누구인가'},
    {key:'B', title:'창업 초기 썰'},
    {key:'C', title:'개인적인 질문'},
    {key:'D', title:'원초적 / 예능형 질문'},
    {key:'E', title:'진지한 가치관 질문'},
    {key:'F', title:'곤란했지만 사실 자랑'},
    {key:'G', title:'밸런스게임'},
    {key:'H', title:'마무리 — 훅 / 캐치프레이즈'}
  ];
  var QUESTIONS = [
    [1,'A','지금 대표님은 정확히 어떤 일을 하고 계신가요? (매스커피·용삼식당 둘 다 운영하시는 것에 대해 설명 부탁드립니다)'],
    [2,'A','원래부터 사업을 하고 싶으셨나요, 아니면 어쩌다 시작하게 되신 건가요?'],
    [3,'A','처음 시작하신 사업은 무엇이었나요? 그때 나이가 어떻게 되셨나요?'],
    [4,'A','지금까지 몇 개의 브랜드·매장을 운영해보셨나요?'],
    [5,'A','용삼식당이라는 이름은 어떻게 짓게 되셨나요?'],
    [6,'A','커피를 판매하시다가 고깃집(용삼식당)을 시작하신 이유가 궁금합니다.'],
    [7,'A','홍대 건축학과를 나오셨는데, 왜 사업을 시작하시게 되었나요?'],
    [8,'A','용삼식당은 어떻게 시작하게 되셨나요? 어디서 영감을 받으셨나요?'],
    [9,'B','사업을 처음 시작하셨을 때 정말 힘드셨던 순간 하나만 말씀해주시겠어요?'],
    [10,'B','그때로 돌아간다면 다르게 하고 싶은 일이 있으신가요?'],
    [11,'B','첫 매장을 여셨을 때, 첫 손님이 기억나시나요?'],
    [12,'B','사업하시면서 가장 크게 실패하셨던 경험이 있다면요?'],
    [13,'B','그 실패에서 무엇을 배우셨나요?'],
    [14,'B','장사를 처음 시작하실 때로 다시 돌아간다면, 절대 안 하실 것 3가지만 꼽아주시겠어요?'],
    [15,'B','다시 1호점을 시작하신다면, 딱 이것부터 바꾸시겠다는 게 있을까요?'],
    [16,'C','쉬는 날엔 뭐 하시나요? 진짜 쉬시긴 하시나요?'],
    [17,'C','가족분들은 대표님이 이렇게 일하시는 걸 어떻게 생각하시나요?'],
    [18,'C','사업을 하지 않으셨다면 지금 뭘 하고 계셨을 것 같으세요?'],
    [19,'C','존경하는 분이나 롤모델이 있으신가요?'],
    [20,'C','지금까지 가장 큰 영감을 받으신 이야기가 있다면 들려주시겠어요?'],
    [21,'C','요즘 가장 큰 고민이 무엇인가요?'],
    [22,'C','최근에 가장 뿌듯하셨던 순간이 있다면요?'],
    [23,'C','살아오시면서 가장 후회되는 결정이 있으시다면요?'],
    [24,'C','스트레스는 어떻게 푸시나요?'],
    [25,'C','본인 성격을 한 단어로 표현하신다면요?'],
    [26,'C','10년 후에는 어떤 모습이실 것 같으세요?'],
    [27,'C','대표님 인생에서 가장 잘하신 선택을 하나만 꼽으신다면요?'],
    [28,'C',"대표님에게 '돈'이란 무엇인가요?"],
    [29,'D','오이 vs 파, 절대 못 드시는 것 하나만 고르신다면요?'],
    [30,'D','여름에 매장 에어컨 온도는 몇 도가 적정이라고 생각하세요? (직원분들과 온도 때문에 다투신 적 있으세요?)'],
    [31,'D','회식하실 때 직접 고기를 구우시는 편인가요, 아니면 맡기시는 편인가요?'],
    [32,'D','본인 요리 실력은 스스로 몇 점을 주시겠어요?'],
    [33,'D','직원분들 몰래 제일 자주 드시는 메뉴가 있으신가요?'],
    [34,'E','손님을 응대하실 때 가장 중요하게 생각하시는 가치를 하나만 꼽으신다면요?'],
    [35,'E','일 잘하는 직원의 조건을 3가지만 말씀해주시겠어요?'],
    [36,'E','반대로 함께 일하기 어렵다고 느끼시는 직원 유형이 있다면요?'],
    [37,'E','장사하시면서 절대 타협하지 않으시는 원칙이 있으시다면요?'],
    [38,'E','장사하시면서 가장 후회했던 결정이 있다면요?'],
    [39,'E',"대표님이 생각하시는 '장사 잘하는 사람'의 공통점은 무엇인가요?"],
    [40,'E','장사하는 후배들에게 딱 한 가지 조언을 하신다면요?'],
    [41,'E','월천(월 순이익 1천만원)을 처음 달성했다면, 제일 먼저 해야 하는 일이 뭘까요?'],
    [42,'F','줄이 길게 늘어서 있는데 재료가 모자랐던 적이 있으신가요? 그날 어떻게 해결하셨나요?'],
    [43,'F','재료가 소진돼서 예정보다 일찍 마감하신 적 있으세요? 그날 몇 시에 문을 닫으셨나요?'],
    [44,'F','대기하시던 손님이 화를 내신 적 있으세요? 그 상황은 결국 어떻게 마무리되셨나요?'],
    [45,'F','갑자기 단체 손님이 몰려서 정신없으셨던 날, 그날은 어떻게 버티셨나요?'],
    [46,'F','특정 메뉴가 너무 잘 팔려서 오히려 곤란하셨던 적 있으세요? (품절 관리 등)'],
    [47,'F','홀에 자리가 없어서 대기 손님을 응대하시기 가장 곤란하셨던 순간이 있다면요?'],
    [48,'F','직원은 부족한데 손님은 계속 오시는 날, 그럴 때 대표님은 어떻게 하시나요?'],
    [49,'G','싸가지 없는데 일 잘하는 직원 vs 싸가지는 있는데 일 못하는 직원 — 어느 쪽이신가요?'],
    [50,'G','매출 1억·순이익 500 vs 매출 7천·순이익 1,500 — 어느 쪽이신가요?'],
    [51,'G','고집 센 경력 10년 vs 배우려는 신입 1년 — 어느 쪽이신가요?'],
    [52,'G','맛 최고·서비스 부족 vs 맛 평범·서비스 최고 — 어느 쪽이신가요?'],
    [53,'G','내가 좋아하는 장사 vs 돈이 되는 장사 — 어느 쪽이신가요?'],
    [54,'H','마지막으로, 용삼식당 하면 딱 떠오르는 한 마디를 만들어주시겠어요? (예: "냉삼은 용삼식당" 같은 톤)']
  ];
  var CAT_TITLE = {};
  CATS.forEach(function(c){ CAT_TITLE[c.key] = c.title; });

  var STORAGE_KEY = 'yongsam-interview-answers-v2';
  var WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbytNw69UIfpG5UHnR2lqKEHOZvWFO5diQj3N03cZyW4GDlNVZSNgAsLuLnF2WtHIl111g/exec';

  var answers = {};
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) answers = JSON.parse(raw) || {};
  } catch (e) {}

  var index = 0;
  var total = QUESTIONS.length;

  var statusLine = document.getElementById('statusLine');
  var progressFill = document.getElementById('progressFill');
  var cardWrap = document.getElementById('cardWrap');
  var doneScreen = document.getElementById('doneScreen');
  var cardCat = document.getElementById('cardCat');
  var cardPos = document.getElementById('cardPos');
  var cardQ = document.getElementById('cardQ');
  var answerBox = document.getElementById('answerBox');
  var btnDone = document.getElementById('btnDone');
  var btnSkip = document.getElementById('btnSkip');
  var btnPrev = document.getElementById('btnPrev');

  function setStatus(text, isErr){
    statusLine.textContent = text;
    statusLine.className = 'status' + (isErr ? ' err' : '');
  }

  function persistLocal(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(answers)); } catch (e) {}
  }

  function syncToSheet(qNum, value){
    var payload = {}; payload[qNum] = value;
    return fetch(WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({ answers: payload })
    });
  }

  function renderCard(){
    var q = QUESTIONS[index];
    cardCat.textContent = q[1] + ' · ' + CAT_TITLE[q[1]];
    cardPos.textContent = (index + 1) + ' / ' + total;
    cardQ.textContent = q[0] + '. ' + q[2];
    answerBox.value = answers['q' + q[0]] || '';
    progressFill.style.width = ((index) / total * 100) + '%';
    btnPrev.disabled = index === 0;
    btnPrev.style.opacity = index === 0 ? '0.35' : '1';
    btnDone.textContent = '완료 → 다음';
    btnDone.classList.remove('saved');
    cardWrap.style.display = '';
    doneScreen.style.display = 'none';
    document.getElementById('resultView').classList.remove('show');
    answerBox.focus();
  }

  function saveCurrent(advance){
    var q = QUESTIONS[index];
    var val = answerBox.value;
    var id = 'q' + q[0];
    var changed = answers[id] !== val;
    if (val.trim() === '') { delete answers[id]; } else { answers[id] = val; }
    persistLocal();

    if (changed) {
      setStatus('구글시트에 저장 중…');
      syncToSheet(q[0], val).then(function(){
        setStatus('구글시트에 저장됨 · ' + nowTime());
      }).catch(function(){
        setStatus('동기화 실패 — 인터넷 연결을 확인해주세요 (이 화면에는 저장됨)', true);
      });
    }

    if (advance) {
      btnDone.textContent = '✓ 저장됨';
      btnDone.classList.add('saved');
      setTimeout(function(){
        if (index < total - 1) {
          index++;
          renderCard();
        } else {
          showDone();
        }
      }, 320);
    }
  }

  function nowTime(){
    var d = new Date();
    function p(x){ return (x < 10 ? '0' : '') + x; }
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function showDone(){
    cardWrap.style.display = 'none';
    doneScreen.style.display = '';
  }

  btnDone.addEventListener('click', function(){ saveCurrent(true); });
  btnSkip.addEventListener('click', function(){
    if (index < total - 1) { index++; renderCard(); } else { showDone(); }
  });
  btnPrev.addEventListener('click', function(){
    if (index === 0) return;
    saveCurrent(false);
    index--;
    renderCard();
  });
  answerBox.addEventListener('keydown', function(ev){
    if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter') { saveCurrent(true); }
  });
  answerBox.addEventListener('blur', function(){ saveCurrent(false); });

  document.getElementById('doneEdit').addEventListener('click', function(){
    index = 0; renderCard();
  });
  document.getElementById('doneResult').addEventListener('click', function(){
    doneScreen.style.display = 'none';
    showResult();
  });

  // ── 질문 목록 패널 ──
  var listPanel = document.getElementById('listPanel');
  var listBody = document.getElementById('listBody');

  function renderList(){
    listBody.innerHTML = '';
    CATS.forEach(function(cat){
      var t = document.createElement('div');
      t.className = 'list-cat-title';
      t.textContent = cat.key + ' · ' + cat.title;
      listBody.appendChild(t);
      var grid = document.createElement('div');
      grid.className = 'num-grid';
      QUESTIONS.filter(function(q){ return q[1] === cat.key; }).forEach(function(q){
        var b = document.createElement('button');
        b.className = 'num-btn' + (answers['q' + q[0]] ? ' filled' : '') + (QUESTIONS[index][0] === q[0] ? ' current' : '');
        b.textContent = q[0];
        b.addEventListener('click', function(){
          saveCurrent(false);
          index = QUESTIONS.findIndex(function(qq){ return qq[0] === q[0]; });
          renderCard();
          listPanel.classList.remove('show');
        });
        grid.appendChild(b);
      });
      listBody.appendChild(grid);
    });
  }

  document.getElementById('openList').addEventListener('click', function(){
    saveCurrent(false);
    renderList();
    listPanel.classList.add('show');
  });
  document.getElementById('closeList').addEventListener('click', function(){
    listPanel.classList.remove('show');
  });

  // ── 결과지 ──
  var resultView = document.getElementById('resultView');
  var resultBody = document.getElementById('resultBody');

  function showResult(){
    resultBody.innerHTML = '';
    var any = false;
    CATS.forEach(function(cat){
      var qs = QUESTIONS.filter(function(q){ return q[1] === cat.key && answers['q' + q[0]]; });
      if (qs.length === 0) return;
      any = true;
      var block = document.createElement('div');
      block.className = 'result-cat';
      block.innerHTML = '<div class="result-cat-title">' + cat.key + ' · ' + cat.title + '</div>';
      qs.forEach(function(q){
        var rq = document.createElement('div');
        rq.className = 'result-q';
        rq.innerHTML = '<div class="rq">' + q[0] + '. ' + q[2].replace(/</g,'&lt;') + '</div><div class="ra"></div>';
        rq.querySelector('.ra').textContent = answers['q' + q[0]];
        block.appendChild(rq);
      });
      resultBody.appendChild(block);
    });
    if (!any) resultBody.innerHTML = '<div class="result-empty">아직 채워진 답변이 없습니다.</div>';
    cardWrap.style.display = 'none';
    doneScreen.style.display = 'none';
    resultView.classList.add('show');
  }

  document.getElementById('backToForm').addEventListener('click', function(){
    resultView.classList.remove('show');
    renderCard();
  });
  document.getElementById('printResult').addEventListener('click', function(){
    showResult();
    window.print();
  });
  document.getElementById('copySheet').addEventListener('click', function(){
    var lines = ['번호\t카테고리\t질문\t답변'];
    QUESTIONS.forEach(function(q){
      var ans = (answers['q' + q[0]] || '').replace(/\t/g, ' ').replace(/\n/g, ' / ');
      lines.push(q[0] + '\t' + q[1] + '\t' + q[2].replace(/\t/g, ' ') + '\t' + ans);
    });
    navigator.clipboard.writeText(lines.join('\n')).then(function(){
      var btn = document.getElementById('copySheet');
      var orig = btn.textContent;
      btn.textContent = '복사됨!';
      setTimeout(function(){ btn.textContent = orig; }, 1500);
    }).catch(function(){ alert('복사에 실패했습니다.'); });
  });

  setStatus('자동으로 구글 시트에 저장됩니다');
  renderCard();
})();
</script>
</body>
</html>
